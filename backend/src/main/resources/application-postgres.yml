# ---------------------------------------------------------------------------
# Perfil "postgres" -- persistencia real con Flyway + PostgreSQL.
# ---------------------------------------------------------------------------
# Las credenciales se inyectan por variables de entorno (backend/.env) o por
# el sistema de environment de Spring Boot. Si falta alguna, la app falla
# rápido con un error claro.
#
# Variables requeridas:
#   SPRING_DATASOURCE_URL      jdbc:postgresql://localhost:5432/acreditacion
#   SPRING_DATASOURCE_USERNAME usuario de la base
#   SPRING_DATASOURCE_PASSWORD clave de la base
# ---------------------------------------------------------------------------
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/acreditacion?sslmode=disable}
    username: ${SPRING_DATASOURCE_USERNAME:acreditacion_user}
    password: ${SPRING_DATASOURCE_PASSWORD:acreditacion_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:30}
      minimum-idle: ${HIKARI_MIN_IDLE:10}
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
