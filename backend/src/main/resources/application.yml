server:
  port: 8080

spring:
  main:
    banner-mode: off
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgres}
  application:
    name: acreditacion-backend

logging:
  level:
    org.springframework: WARN
    com.undec.acreditacion: INFO
    org.flywaydb: INFO

security:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  admin:
    initial-email: ${ADMIN_INITIAL_EMAIL:admin@undec.edu.ar}
    initial-password: ${ADMIN_INITIAL_PASSWORD:admin123}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket: ${MINIO_BUCKET:instituciones-logos}

spring.mail:
  host: ${SPRING_MAIL_HOST:localhost}
  port: ${SPRING_MAIL_PORT:1025}
  username: ${SPRING_MAIL_USERNAME:acreditacion@undec.edu.ar}
  password: ${SPRING_MAIL_PASSWORD:}


